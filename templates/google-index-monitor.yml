name: GEO Lab — Multi-Engine Discoverability Monitor

on:
  workflow_dispatch:
  schedule:
    # Mondays 10:17 Asia/Shanghai. GitHub may delay scheduled starts.
    - cron: '17 2 * * 1'

permissions:
  contents: write
  issues: write

concurrency:
  group: geo-google-index-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Fail closed if this template is accidentally installed in the public site.
    if: github.repository == 'helen-bird/geo-index-monitor' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the private monitor and durable state
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Use Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Inspect Google indexed state
        id: monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
        run: python3 scripts/index_monitor_actions.py run --output state --inventory monitoring/google-index/urls.json --refresh-inventory
      - name: Inspect Bing and OpenAI eligibility; notify real IndexNow changes
        id: discoverability
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Explicit opt-in; a present API key never changes the OAuth default.
          BING_AUTH_METHOD: ${{ vars.BING_AUTH_METHOD || 'oauth' }}
          BING_OAUTH_CREDENTIALS: ${{ secrets.BING_OAUTH_CREDENTIALS }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python3 scripts/discoverability_actions.py --output state
      - name: Persist private history even after an authorization or API failure
        if: always() && steps.checkout.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/index_monitor_actions.py persist --output state
      - name: Preserve a failing workflow result when inspection did not succeed
        if: always() && (steps.monitor.outcome != 'success' || steps.discoverability.outcome != 'success')
        run: exit 1
